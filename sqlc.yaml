version: "2"
sql:
  - engine: "postgresql"
    queries: "domain/repository/teams-repository"
    schema: "migration"
    gen:
      go:
        package: "teamsdb"
        out: "domain/repository/teams-repository/db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_json_tags: true
        emit_interface: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        json_tags_case_style: snake